server {
    listen 80;
    server_name localhost;

    # DNS resolver interno de Docker (evita que Nginx crashee en el arranque si el upstream no resuelve de inmediato)
    resolver 127.0.0.11 valid=30s ipv6=off;

    root /usr/share/nginx/html/browser;
    index index.html;

    # Compresión Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy para la API hacia el contenedor NestJS en la red interna de Dokploy
    location /api/ {
        set $backend_host "summaryhub-backend-wrvv9a";
        proxy_pass http://$backend_host:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy para WebSockets (Socket.IO)
    location /socket.io/ {
        set $backend_host "summaryhub-backend-wrvv9a";
        proxy_pass http://$backend_host:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache para estáticos
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}

