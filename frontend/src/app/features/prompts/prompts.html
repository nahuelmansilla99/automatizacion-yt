<!-- Página de gestión de prompts -->
<div class="space-y-6">

  <!-- Header -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-[var(--light0)] flex items-center gap-2">
        <span>🧠</span> Gestión de Prompts
      </h1>
      <p class="text-sm text-[var(--light3)] mt-1">
        Administrá los prompts de IA para personalizar el tipo de resumen según el contenido del video.
      </p>
    </div>
    <button
      (click)="openCreateForm()"
      class="inline-flex items-center gap-2 rounded-lg bg-[var(--bright-orange)] px-5 py-2.5 text-sm font-bold text-[var(--dark0-hard)] hover:brightness-110 active:scale-95 transition-all shadow-md cursor-pointer"
    >
      <span class="text-base">＋</span>
      Nuevo Prompt
    </button>
  </div>

  <!-- Lista de prompts -->
  <app-prompt-list
    [prompts]="prompts()"
    [loading]="loading()"
    (onEdit)="openEditForm($event)"
    (onDetail)="openDetail($event)"
    (onSetDefault)="setDefault($event)"
    (onDelete)="deletePrompt($event)"
    (onToggleActive)="toggleActive($event)"
  />

</div>

<!-- Modal de formulario (crear/editar) -->
@if (isFormModalOpen()) {
  <app-prompt-form-modal
    [prompt]="editingPrompt()"
    (onClose)="closeFormModal()"
    (onSaved)="onPromptSaved()"
  />
}

<!-- Modal de detalle e historial -->
@if (detailPrompt()) {
  <app-prompt-detail-modal
    [prompt]="detailPrompt()!"
    (onClose)="closeDetail()"
    (onEdit)="openEditForm($event)"
  />
}
