<!-- Backdrop -->
<div
  class="fixed inset-0 z-50 flex items-start justify-center bg-black/70 backdrop-blur-sm p-4 pt-12 overflow-y-auto"
  (click)="onClose.emit()"
>
  <!-- Modal container -->
  <div
    class="relative w-full max-w-3xl rounded-2xl bg-[var(--dark1)] border border-[var(--dark2)] shadow-2xl"
    (click)="$event.stopPropagation()"
  >
    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-4 border-b border-[var(--dark2)]">
      <h2 class="text-lg font-bold text-[var(--light0)] flex items-center gap-2">
        {{ isEditing ? 'Editar Prompt' : 'Nuevo Prompt' }}
      </h2>
      <button
        (click)="onClose.emit()"
        class="text-[var(--light3)] hover:text-[var(--bright-red)] text-xl transition-colors cursor-pointer"
      >✕</button>
    </div>

    <!-- Formulario -->
    <form (submit)="$event.preventDefault(); onSubmit()" class="p-6 space-y-5">

      <!-- Nombre -->
      <div>
        <label class="block text-xs font-semibold text-[var(--light3)] uppercase tracking-wider mb-1.5">
          Nombre del Prompt *
        </label>
        <input
          type="text"
          [(ngModel)]="name"
          name="name"
          placeholder="Ej: Podcast Detallado, Clase Educativa, Keynote..."
          class="w-full rounded-lg bg-[var(--dark0-hard)] border border-[var(--dark2)] px-4 py-2.5 text-sm text-[var(--light0)] placeholder-[var(--dark4)] focus:border-[var(--bright-orange)] focus:outline-none transition-colors"
        />
      </div>

      <!-- Tags -->
      <div>
        <label class="block text-xs font-semibold text-[var(--light3)] uppercase tracking-wider mb-1.5">
          Tags (separados por coma)
        </label>
        <input
          type="text"
          [(ngModel)]="tagsInput"
          name="tags"
          placeholder="Ej: podcast, educacion, tecnologia, entrevista"
          class="w-full rounded-lg bg-[var(--dark0-hard)] border border-[var(--dark2)] px-4 py-2.5 text-sm text-[var(--light0)] placeholder-[var(--dark4)] focus:border-[var(--bright-orange)] focus:outline-none transition-colors"
        />
        <p class="text-xs text-[var(--light4)] mt-1">Los # son opcionales. Ej: <code class="text-[var(--bright-aqua)]">podcast, educacion</code></p>
      </div>

      <!-- Contenido / System Instruction -->
      <div>
        <label class="block text-xs font-semibold text-[var(--light3)] uppercase tracking-wider mb-1.5">
          System Instruction (Prompt) *
        </label>
        <textarea
          [(ngModel)]="content"
          name="content"
          rows="16"
          placeholder="Eres un asistente experto en... Tu objetivo es..."
          class="w-full rounded-lg bg-[var(--dark0-hard)] border border-[var(--dark2)] px-4 py-2.5 text-sm text-[var(--light0)] placeholder-[var(--dark4)] focus:border-[var(--bright-orange)] focus:outline-none transition-colors font-mono resize-y min-h-[200px]"
        ></textarea>
        <p class="text-xs text-[var(--light4)] mt-1">Este texto se enviará como <code class="text-[var(--bright-aqua)]">systemInstruction</code> a Gemini.</p>
      </div>

      <!-- Opciones -->
      <div class="flex flex-col sm:flex-row gap-4">
        <!-- isDefault -->
        <label class="flex items-center gap-3 cursor-pointer group">
          <div
            class="relative w-10 h-5 rounded-full transition-colors"
            [class.bg-[var(--bright-orange)]]="isDefault"
            [class.bg-[var(--dark3)]]="!isDefault"
            (click)="isDefault = !isDefault"
          >
            <span
              class="absolute top-0.5 left-0.5 w-4 h-4 rounded-full bg-white shadow transition-transform"
              [class.translate-x-5]="isDefault"
            ></span>
          </div>
          <span class="text-sm text-[var(--light2)]">Establecer como predeterminado</span>
        </label>

        <!-- isActive -->
        <label class="flex items-center gap-3 cursor-pointer group">
          <div
            class="relative w-10 h-5 rounded-full transition-colors"
            [class.bg-[var(--bright-green)]]="isActive"
            [class.bg-[var(--dark3)]]="!isActive"
            (click)="isActive = !isActive"
          >
            <span
              class="absolute top-0.5 left-0.5 w-4 h-4 rounded-full bg-white shadow transition-transform"
              [class.translate-x-5]="isActive"
            ></span>
          </div>
          <span class="text-sm text-[var(--light2)]">Activo</span>
        </label>
      </div>

      <!-- Acciones -->
      <div class="flex justify-end gap-3 pt-2">
        <button
          type="button"
          (click)="onClose.emit()"
          class="rounded-lg border border-[var(--dark3)] px-5 py-2.5 text-sm text-[var(--light3)] hover:border-[var(--light3)] hover:text-[var(--light0)] transition-colors cursor-pointer"
        >
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="saving()"
          class="inline-flex items-center gap-2 rounded-lg bg-[var(--bright-orange)] px-6 py-2.5 text-sm font-bold text-[var(--dark0-hard)] hover:brightness-110 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed transition-all cursor-pointer"
        >
          @if (saving()) {
            <svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Guardando...
          } @else {
            {{ isEditing ? 'Guardar cambios' : 'Crear Prompt' }}
          }
        </button>
      </div>

    </form>
  </div>
</div>
