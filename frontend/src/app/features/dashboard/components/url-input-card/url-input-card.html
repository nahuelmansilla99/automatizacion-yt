<section class="flex flex-col gap-3 font-mono">
  <!-- Sección Header tipo terminal -->
  <h2 class="terminal-divider text-xs sm:text-sm">
    ── NUEVO_RESUMEN ────────────────────────────────────────────────────────────────
  </h2>

  <form (submit)="onSubmit($event)" class="flex flex-col gap-4 mt-1">

    <!-- URL Input: bloque prominente con borde completo -->
    <div class="url-input-block" [class.url-input-block--error]="hasError()" [class.url-input-block--valid]="isValidUrl()">

      <!-- Label interior -->
      <div class="url-input-label">
        <span class="url-input-label__prefix">YT</span>
        <span class="url-input-label__text">URL_VIDEO</span>
      </div>

      <!-- Row de input + botón limpiar -->
      <div class="url-input-row">
        <input
          type="url"
          name="youtubeUrl"
          [(ngModel)]="url"
          (ngModelChange)="onUrlChange($event)"
          placeholder="https://www.youtube.com/watch?v=..."
          required
          class="url-input-field"
          autocomplete="off"
          autofocus
        />
        @if (url()) {
          <button
            type="button"
            (click)="clearUrl()"
            class="url-input-clear"
            title="Limpiar URL"
          >
            [ X ]
          </button>
        }
      </div>
    </div>

    <!-- Selector de Prompt -->
    @if (prompts().length > 0) {
      <div class="flex flex-col gap-2">
        <div class="flex items-center gap-2 terminal-label">
          <span class="text-[var(--terminal-bright)]">›</span>
          <span>prompt_sistema .......</span>
        </div>

        <select
          name="promptId"
          [ngModel]="selectedPromptId()"
          (ngModelChange)="selectedPromptId.set($event)"
          class="terminal-select"
        >
          @for (prompt of prompts(); track prompt.id) {
            <option [value]="prompt.id" class="bg-[var(--terminal-bg)] text-[var(--terminal-bright)]">
              {{ prompt.name }}{{ prompt.isDefault ? ' [DEFAULT]' : '' }}
              @if (prompt.tags.length > 0) { #{{ prompt.tags[0] }} }
            </option>
          }
        </select>
      </div>
    }

    <!-- Submit Button -->
    <button
      type="submit"
      [disabled]="store.submitting() || !isValidUrl()"
      class="terminal-btn-primary terminal-btn-primary--full"
    >
      @if (store.submitting()) {
        <span class="animate-spin text-sm">◴</span>
        <span>[ DESPACHANDO... ]</span>
      } @else {
        <span>[ EJECUTAR_RESUMEN → ]</span>
      }
    </button>

  </form>
</section>
