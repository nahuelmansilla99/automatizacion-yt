<section class="flex flex-col gap-3 font-mono">
  <!-- Sección Header tipo terminal -->
  <h2 class="terminal-divider text-xs sm:text-sm">
    ── NUEVO_RESUMEN ────────────────────────────────────────────────────────────────
  </h2>

  <form (submit)="onSubmit($event)" class="flex flex-col gap-4 mt-1">
    <!-- URL Input row -->
    <div class="flex flex-col gap-2">
      <div class="flex items-center gap-2 terminal-label">
        <span class="text-[var(--terminal-bright)]">&gt;</span>
        <span>url_video ............</span>
      </div>

      <div class="relative w-full">
        <input
          type="url"
          name="youtubeUrl"
          [(ngModel)]="url"
          (ngModelChange)="onUrlChange($event)"
          placeholder="https://www.youtube.com/watch?v=..."
          required
          class="terminal-input font-mono"
          [class.border-[var(--terminal-error)]]="hasError()"
        />
        @if (url()) {
          <button
            type="button"
            (click)="clearUrl()"
            class="absolute right-1 top-1/2 -translate-y-1/2 terminal-action-link px-1"
            title="Limpiar URL"
          >
            [ X ]
          </button>
        }
      </div>
    </div>

    <!-- Selector de Prompt -->
    @if (prompts().length > 0) {
      <div class="flex flex-col gap-2">
        <div class="flex items-center gap-2 terminal-label">
          <span class="text-[var(--terminal-bright)]">&gt;</span>
          <span>prompt_sistema .......</span>
        </div>

        <select
          name="promptId"
          [ngModel]="selectedPromptId()"
          (ngModelChange)="selectedPromptId.set($event)"
          class="terminal-select"
        >
          @for (prompt of prompts(); track prompt.id) {
            <option [value]="prompt.id" class="bg-[var(--terminal-bg)] text-[var(--terminal-bright)]">
              {{ prompt.name }}{{ prompt.isDefault ? ' [DEFAULT]' : '' }}
              @if (prompt.tags.length > 0) { #{{ prompt.tags[0] }} }
            </option>
          }
        </select>
      </div>
    }

    <!-- Submit Button & Feedback -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pt-2">
      <button
        type="submit"
        [disabled]="store.submitting() || !isValidUrl()"
        class="terminal-btn-primary"
      >
        @if (store.submitting()) {
          <span class="animate-spin text-sm">◴</span>
          <span>[ DESPACHANDO... ]</span>
        } @else {
          <span>[ EJECUTAR_RESUMEN -&gt; ]</span>
        }
      </button>

      @if (hasError()) {
        <p class="text-xs text-[var(--terminal-error)] flex items-center gap-1 uppercase">
          <span>!</span> url inválida: ingrese formato watch?v= o youtu.be
        </p>
      }
    </div>
  </form>
</section>
