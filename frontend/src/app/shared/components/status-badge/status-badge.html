@switch (status()) {
  @case ('SUCCESS') {
    <span class="inline-flex items-center gap-1 text-xs text-[var(--terminal-success)] font-mono font-bold">
      <span>●</span>
      <span>COMPLETADO</span>
    </span>
  }
  @case ('PENDING') {
    <span class="inline-flex items-center gap-1 text-xs text-[var(--terminal-warn)] font-mono">
      <span class="animate-spin">◌</span>
      <span>PROCESANDO</span>
    </span>
  }
  @case ('ERROR') {
    <span class="inline-flex items-center gap-1 text-xs text-[var(--terminal-error)] font-mono font-bold">
      <span>✕</span>
      <span>ERROR</span>
    </span>
  }
}
