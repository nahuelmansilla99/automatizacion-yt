services:
  postgres:
    image: postgres:16-alpine
    container_name: yt-summary-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres123}
      POSTGRES_DB: ${DATABASE_NAME:-yt_summaries_db}
    ports:
      - "${DATABASE_PORT:-5434}:5432"
    volumes:
      - yt_summary_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-yt_summaries_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yt-summary-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres123}
      DATABASE_NAME: ${DATABASE_NAME:-yt_summaries_db}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-mi_super_secreto_webhook_12345}
      SUPADATA_API_KEY: ${SUPADATA_API_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yt-summary-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PORT_FRONTEND:-8080}:80"

volumes:
  yt_summary_postgres_data:
    name: yt_summary_postgres_data
